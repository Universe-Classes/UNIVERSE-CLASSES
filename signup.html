<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up · Lamp</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root {
      --bg-color: #0b0f14;
      --font-family: 'Poppins', sans-serif;

      --theme-color: #2a2c30;
      --theme-glow-rgb: 42, 44, 48;
      --shade-color: #2c2c2c;
      --bulb-color: #1a1a1a;
      --light-opacity: 0;

      --btn-bg: #2a2c30;
      --btn-text-color: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: #fff;
      font-family: var(--font-family);
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 1100px;
      height: 600px;
      padding: 2rem;
      gap: 2rem;
    }

    .lamp-section {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lamp-ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(var(--theme-glow-rgb), 0.15) 0%, transparent 70%);
      transition: background 0.6s ease;
      pointer-events: none;
      z-index: -1;
    }

    .lamp-svg {
      width: 100%;
      max-width: 350px;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
    }

    .shade-main { fill: var(--shade-color); transition: fill 0.6s ease; }
    .shade-inner { fill: var(--bulb-color); transition: fill 0.6s ease; }
    .light-cone { opacity: var(--light-opacity); transition: opacity 0.6s ease; }

    .face-sleep { transition: opacity 0.3s ease; }
    .face-awake { opacity: 0; transition: opacity 0.3s ease; }

    .pull-string-group {
      cursor: pointer;
      transform-origin: top;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .pull-string-group:hover .string-handle { stroke: #fff; }

    .form-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-card {
      width: 100%;
      max-width: 400px;
      padding: 3rem 2.5rem;
      border-radius: 20px;
      background: rgba(18, 24, 32, 0.6);
      backdrop-filter: blur(12px);
      border: 2px solid var(--theme-color);
      box-shadow:
        0 0 30px rgba(var(--theme-glow-rgb), 0.15),
        inset 0 0 15px rgba(255, 255, 255, 0.02);
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }

    .form-card h2 {
      margin-bottom: 0.5rem;
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
    }

    .form-card .subtitle {
      margin-bottom: 2rem;
      color: #777;
      font-size: 0.9rem;
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.5rem;
    }

    .input-group label {
      margin-bottom: 0.5rem;
      color: #a0a0a0;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .input-group input {
      padding: 1rem 1.2rem;
      border-radius: 10px;
      border: 1px solid #2a2c30;
      background: #151a21;
      color: #fff;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 10px rgba(var(--theme-glow-rgb), 0.3);
    }

    .input-hint {
      margin-top: 0.4rem;
      color: #f87171;
      font-size: 0.78rem;
      min-height: 1em;
    }

    .submit-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-text-color);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s ease;
    }
    .submit-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .form-footer {
      display: block;
      margin-top: 1.5rem;
      color: #777;
      text-align: center;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .form-footer a {
      color: #ccc;
      text-decoration: none;
      font-weight: 600;
    }
    .form-footer a:hover { color: #fff; }

    @media (max-width: 768px) {
      .container { flex-direction: column; height: auto; }
      .lamp-svg { max-width: 250px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="lamp-section">
      <div class="lamp-ambient-glow"></div>
      <svg class="lamp-svg" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lightConeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <clipPath id="mouthClip">
            <path d="M 125 155 Q 150 190 175 155 Z" />
          </clipPath>
        </defs>

        <polygon points="90,180 210,180 320,450 -20,450" fill="url(#lightConeGrad)" class="light-cone" />
        <ellipse cx="150" cy="400" rx="60" ry="15" fill="#151515" />
        <ellipse cx="150" cy="395" rx="60" ry="15" fill="#3a3c40" />
        <rect x="140" y="180" width="20" height="220" fill="#2a2c30" />
        <rect x="142" y="180" width="8" height="220" fill="#4a4c50" />
        <ellipse cx="150" cy="175" rx="90" ry="20" class="shade-inner" />

        <g class="pull-string-group" onclick="toggleLamp()">
          <line x1="105" y1="180" x2="105" y2="280" stroke="#555" stroke-width="3" />
          <line x1="105" y1="280" x2="105" y2="310" stroke="#888" stroke-width="6" stroke-linecap="round" class="string-handle" />
        </g>

        <path d="M 95 60 Q 150 45 205 60 L 240 175 Q 150 195 60 175 Z" class="shade-main" />

        <g class="face-sleep">
          <path d="M 115 130 Q 125 140 135 130" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" />
          <path d="M 165 130 Q 175 140 185 130" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" />
        </g>

        <g class="face-awake">
          <path d="M 115 130 Q 125 115 135 130" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" />
          <path d="M 165 130 Q 175 115 185 130" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" />
          <g>
            <path d="M 125 155 Q 150 190 175 155 Z" fill="#111" />
            <path d="M 140 165 Q 150 190 160 165 Z" fill="#f87171" clip-path="url(#mouthClip)" />
          </g>
        </g>
      </svg>
    </div>

    <div class="form-section">
      <div class="form-card">
        <h2>Create account</h2>
        <p class="subtitle">The lamp wakes up once you're all set.</p>

        <form id="signupForm" novalidate>
          <div class="input-group">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            <span class="input-hint" id="fullNameHint"></span>
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <span class="input-hint" id="emailHint"></span>
          </div>

          <div class="input-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" name="password" placeholder="Create a password" required>
            <span class="input-hint" id="signupPasswordHint"></span>
          </div>

          <div class="input-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
            <span class="input-hint" id="confirmPasswordHint"></span>
          </div>

          <button type="submit" class="submit-btn">Sign up</button>
        </form>

        <p class="form-footer">Already have an account? <a href="index.html">Log in</a></p>
      </div>
    </div>

  </div>

  <script>
    const lampMoods = [
      { themeColor: '#2a2c30', themeGlowRgb: '42, 44, 48', shadeColor: '#2c2c2c', bulbColor: '#1a1a1a', lightOpacity: '0',    btnBg: '#2a2c30', btnText: '#888', awake: 0 },
      { themeColor: '#22c55e', themeGlowRgb: '34, 197, 94', shadeColor: '#6c8c73', bulbColor: '#e6ffe6', lightOpacity: '0.15', btnBg: '#22c55e', btnText: '#fff', awake: 1 },
      { themeColor: '#2a2c30', themeGlowRgb: '42, 44, 48', shadeColor: '#2c2c2c', bulbColor: '#1a1a1a', lightOpacity: '0',    btnBg: '#2a2c30', btnText: '#888', awake: 0 },
      { themeColor: '#f97316', themeGlowRgb: '249, 115, 22', shadeColor: '#947463', bulbColor: '#fff0e6', lightOpacity: '0.15', btnBg: '#f97316', btnText: '#fff', awake: 1 },
    ];

    let moodIndex = 0;

    function toggleLamp() {
      const root = document.documentElement.style;
      const pullString = document.querySelector('.pull-string-group');
      const faceAwake = document.querySelector('.face-awake');
      const faceSleep = document.querySelector('.face-sleep');

      pullString.style.transform = 'translateY(15px)';
      setTimeout(() => { pullString.style.transform = 'translateY(0)'; }, 150);

      moodIndex = (moodIndex + 1) % lampMoods.length;
      const mood = lampMoods[moodIndex];

      root.setProperty('--theme-color', mood.themeColor);
      root.setProperty('--theme-glow-rgb', mood.themeGlowRgb);
      root.setProperty('--shade-color', mood.shadeColor);
      root.setProperty('--bulb-color', mood.bulbColor);
      root.setProperty('--light-opacity', mood.lightOpacity);
      root.setProperty('--btn-bg', mood.btnBg);
      root.setProperty('--btn-text-color', mood.btnText);

      faceAwake.style.opacity = mood.awake;
      faceSleep.style.opacity = mood.awake ? 0 : 1;
    }

    const form = document.getElementById('signupForm');
    const fields = {
      fullName: document.getElementById('fullName'),
      email: document.getElementById('email'),
      password: document.getElementById('signupPassword'),
      confirmPassword: document.getElementById('confirmPassword'),
    };
    const hints = {
      fullName: document.getElementById('fullNameHint'),
      email: document.getElementById('emailHint'),
      password: document.getElementById('signupPasswordHint'),
      confirmPassword: document.getElementById('confirmPasswordHint'),
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      hints.fullName.textContent = fields.fullName.value.trim() ? '' : 'Please enter your name';
      if (!fields.fullName.value.trim()) valid = false;

      const emailOk = /\S+@\S+\.\S+/.test(fields.email.value.trim());
      hints.email.textContent = emailOk ? '' : 'Enter a valid email address';
      if (!emailOk) valid = false;

      const passwordOk = fields.password.value.length >= 6;
      hints.password.textContent = passwordOk ? '' : 'Password must be at least 6 characters';
      if (!passwordOk) valid = false;

      const matches = fields.confirmPassword.value === fields.password.value && fields.confirmPassword.value.length > 0;
      hints.confirmPassword.textContent = matches ? '' : 'Passwords do not match';
      if (!matches) valid = false;

      if (valid) {
        // Hook your real signup call up here.
        console.log('Creating account for', fields.email.value.trim());
      }
    });
  </script>
</body>
</html>
